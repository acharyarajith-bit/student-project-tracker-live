<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Project Tracker</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/script.js" defer></script>
</head>
<body>
  <main class="container">
    <header class="header">
      <div>
        <p class="eyebrow">STUDENT WORKSPACE</p>
        <h1>Project Tracker</h1>
        <p class="subtitle">Organize your projects and track your progress.</p>
      </div>
      <span class="live-label">● Live tracker</span>
    </header>

    <section class="panel">
      <h2 id="form-title">Add a project</h2>

      <form id="project-form">
        <label for="project-name">Project name</label>
        <input
          id="project-name"
          name="name"
          type="text"
          placeholder="e.g. Smart Air Quality Monitor"
          maxlength="200"
          required
        >

        <label for="project-status">Status</label>
        <select id="project-status" name="status" required>
          <option value="Planned">Planned</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
        </select>

        <div class="actions">
          <button id="submit-button" type="submit">Add project</button>
          <button id="cancel-button" type="button" class="secondary" hidden>
            Cancel edit
          </button>
        </div>
      </form>

      <p id="message" role="status" aria-live="polite"></p>
    </section>

    <section class="projects-section">
      <div class="section-heading">
        <div>
          <h2>Your projects</h2>
          <p class="subtitle">Projects saved in your database</p>
        </div>
        <button id="refresh-button" class="secondary" type="button">
          Refresh
        </button>
      </div>

      <div id="project-list" class="project-list">
        <p>Loading projects…</p>
      </div>
    </section>
  </main>
</body>
</html>
